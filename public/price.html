  <h1>版本与定价</h1>

  <h2>自托管版：免费</h2>
  <p>本仓库以 AGPL-3.0 开源，包含完整的记录闭环：交割单解析、规则勾选与自写、确定性判定、单日回看、票档案与本机备份。没有账号、没有支付、没有按档位拦截。</p>

  <h2>托管版与内容库：不在本仓</h2>
  <p>托管版是同一份代码加上云存档、多设备同步与内置历史行情包，价格与开通方式在线上站点公布；内容库（复盘动画片段与图鉴）属于独立作品，不随本仓的 AGPL 许可分发。</p>

  <h2>为什么不在页面里放价格</h2>
  <p>价格随时会变，写死在代码里必然过期。本仓只声明「自托管免费、判定能力不收费」这条不变的边界。</p>
