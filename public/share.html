<head>
<meta charset="utf-8">

<title>纪律记分卡｜管住手了吗复盘</title>
<style>
  :root {
    --bg0: #070b16;
    --glass: rgba(255, 255, 255, 0.055);
    --brd: rgba(255, 255, 255, 0.10);
    --txt: #e8edf8;
    --sub: #93a0bd;
    --dim: #7b88a4;
    --acc: #6ee7ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse 60% 40% at 50% -10%, #14224a 0%, transparent 60%), var(--bg0);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 480px; margin: 0 auto;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .card {
    position: relative; overflow: hidden;
    background: var(--glass);
    border: 1px solid var(--brd);
    border-radius: 20px;
    padding: 26px 20px 20px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  .card::before {
    content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  }
  .kicker {
    text-align: center; color: rgba(232, 237, 248, 0.65);
    font-size: 13px; letter-spacing: 0.24em; margin-bottom: 10px;
    overflow-wrap: anywhere;
  }
  .case {
    text-align: center;
    font-size: clamp(22px, 7vw, 30px);
    background: linear-gradient(90deg, #6ee7ff, #a78bfa);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    overflow-wrap: anywhere;
  }
  .sub { text-align: center; color: var(--sub); font-size: 14px; margin-top: 8px; }
  .stats { display: flex; gap: 8px; margin: 22px 0 4px; }
  .stat { flex: 1; min-width: 0; text-align: center; }
  .stat .lab { display: block; color: rgba(255, 255, 255, 0.45); font-size: 12px; margin-bottom: 6px; overflow-wrap: anywhere; }
  .stat b { display: block; font-size: clamp(26px, 9vw, 40px); line-height: 1.1; overflow-wrap: anywhere; }
  blockquote { margin-top: 18px; text-align: center; font-size: 15px; color: var(--txt); line-height: 1.7; overflow-wrap: anywhere; }
  .brandline { margin-top: 24px; text-align: center; color: var(--sub); font-size: 13px; }
  .go { display: block; margin: 14px auto 0; max-width: 260px; text-align: center; color: var(--acc); font-size: 14px; text-decoration: none; border: 1px solid rgba(110, 231, 255, .35); border-radius: 12px; padding: 10px 14px; overflow-wrap: anywhere; }
  .disclaimer { margin-top: 8px; text-align: center; color: var(--dim); font-size: 11px; line-height: 1.6; }
  .demo-mark { position: absolute; top: 14px; right: 14px; color: rgba(251, 191, 36, 0.85); font-size: 11px; font-weight: 700; }
  .clip { background: transparent; }
  .clip video, .clip img { display: block; width: 100%; max-height: 52vh; object-fit: contain; border-radius: 16px; }
  .clip iframe { display: block; width: 100%; height: 52vh; min-height: 320px; max-height: 520px; border: 0; background: #0d100a; }
  .clip-holder { min-height: 320px; border-radius: 16px; overflow: hidden; background-size: cover; background-position: center; }
</style>

<script src="features/share.js"></script>
<script>
/* 分享页控制器：只靠 URL hash 渲染，不依赖 localStorage（对方设备没有账本）。
   降级一律静默：不出现任何提示语、不弹窗、不留占位块，只埋一次 share_fallback。 */
(function () {
  'use strict';
  var app = document.getElementById('app');
  var done = false;            // 页面已到终态（就绪 / 降级）
  var reported = false;        // share_fallback 只埋一次
  var deadline = null;

  function reportOnce(reason, template) {
    if (reported) return;
    reported = true;
    try { PanjiShare.reportFallback(reason, template); } catch (e) { /* 埋点失败不影响渲染 */ }
  }
  function dropClip() {
    var c = document.getElementById('share-clip');
    if (c && c.parentNode) c.parentNode.removeChild(c);
  }
  function fallback(reason, template) {
    if (done) return;
    done = true;
    if (deadline) { clearTimeout(deadline); deadline = null; }
    dropClip();
    reportOnce(reason, template);
  }
  function paint(html) { app.innerHTML = html; }

  var payload = PanjiShare.decode(location.hash);
  var first = PanjiShare.build(payload);
  paint(first.html);

  if (!payload) { fallback('D6', 'card'); return; }

  var wantsClip = payload.template !== 'card' && !!payload.clipRef;
  if (!wantsClip) { fallback(first.reason || 'D1', 'card'); return; }

  // D5：3 秒未就绪 → 撤掉 clip，卡片保留
  deadline = setTimeout(function () { fallback('D5', 'clip-card'); }, 3000);

  PanjiClip.load(PanjiClip.INDEX_URL).then(function () {
    if (done) return;
    var second = PanjiShare.build(payload);
    if (second.fallbackUsed) { fallback(second.reason || 'D2', 'clip-card'); return; }
    paint(second.html);
    bindClip();
  }).then(null, function () {
    fallback('D2', 'clip-card');
  });

  function bindClip() {
    // 挂载/超时收口在 PanjiShare.attachClip（D3 挂载失败 / D5 3 秒未就绪）
    PanjiShare.attachClip(app, {
      timeoutMs: 3000,
      onReady: function () {
        if (done) return;
        done = true;
        if (deadline) { clearTimeout(deadline); deadline = null; }
      },
      onFailed: function (reason) { fallback(reason || 'D3', 'clip-card'); },
    });
  }
})();
</script>
