<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用统计 · 管住手了吗复盘</title>
<style>
  :root{--bg:#070b16;--txt:#e8edf8;--sub:#93a0bd;--dim:#7f8bab;--acc:#6ee7ff;--brd:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(700px 400px at 20% -10%,rgba(110,231,255,.12),transparent 60%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding:24px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:20px;font-weight:800;margin-bottom:4px}
  .sub{font-size:12px;color:var(--sub);margin-bottom:18px}
  .bar{display:flex;gap:8px;margin:0}
  input{flex:1;min-width:0;min-height:44px;background:rgba(0,0,0,.3);border:1px solid var(--brd);border-radius:10px;color:var(--txt);padding:10px 12px;font-family:inherit;font-size:14px;outline:none}
  button{min-height:44px;background:linear-gradient(135deg,#6ee7ff,#a78bfa);border:none;color:#071021;font-weight:700;font-family:inherit;padding:0 18px;border-radius:10px;cursor:pointer}
  .auth{border:1px solid rgba(110,231,255,.35);background:rgba(110,231,255,.07);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .authmsg{font-size:13px;color:var(--acc);margin-bottom:10px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .card{border:1px solid var(--brd);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.04)}
  .k{font-size:11px;color:var(--dim)}
  .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .v.acc{color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--sub)}
  th{color:var(--dim);font-weight:600;font-size:11px}
  td:first-child{color:var(--txt)}
  .err{color:#fca5a5;font-size:12.5px;margin-top:10px}
  .hint{color:var(--dim);font-size:11.5px;margin-top:16px;line-height:1.7}
  .retry{margin-top:10px;padding:8px 14px;border-radius:10px;border:1px solid rgba(240,190,120,.4);background:rgba(240,190,120,.1);color:#e8c99a;font-size:12px;cursor:pointer}
  .retry:active{transform:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>使用统计</h1>
  <p class="sub">页面打开 · 示例体验 · 上传 · 报告 · 分享，按渠道拆分</p>
  <div id="pjl-slot" style="margin-bottom:16px"></div>
  <div id="auth" class="auth" hidden>
    <p class="authmsg">统计接口已开启访问校验，请输入访问 key</p>
    <div class="bar">
      <input id="key" placeholder="访问 key" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go">查看</button>
    </div>
  </div>
  <div id="err" class="err"></div>
  <button id="retry" class="retry" type="button" hidden>重新读取</button>
  <div id="body"></div>
  <p class="hint">口令只存在本标签页的会话存储（sessionStorage），关掉标签页即失效；不进链接、不进本地存储、不进页面源码。数据只含事件名、渠道、匿名设备ID，不含交易内容与IP。</p>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const SK = 'guanzhu_stats_key';   // 只存 sessionStorage：关标签页即失效

  function showAuth(msg) {
    $('#auth').hidden = false;
    $('#err').textContent = msg || '';
  }
  function hideAuth() { $('#auth').hidden = true; }

  // 返回 {data} / {needKey:true} / {error:'...'}；403 与其它错误严格区分
  async function askStats(k) {
    const url = '/api/stats' + (k ? '?key=' + encodeURIComponent(k) : '');
    let r;
    try { r = await fetch(url, { cache: 'no-store' }); }
    catch (e) { return { error: '网络错误，请稍后重试' }; }
    if (r.status === 403) return { needKey: true };
    if (!r.ok) return { error: '读取失败（HTTP ' + r.status + '）' };
    let d;
    try { d = await r.json(); } catch (e) { return { error: '返回格式异常' }; }
    if (!d.ok) return { error: d.error || '读取失败' };
    return { data: d };
  }

  async function apply(k, save) {
    $('#err').textContent = '';
    $('#retry').hidden = true;
    const res = await askStats(k);
    if (res.needKey) { showAuth(k ? '访问 key 不正确，请重新输入' : ''); return false; }
    if (res.error) {
      // 数据加载失败也要有下一步：重试按钮 + 说清最可能的原因，不留空白
      $('#err').textContent = res.error + '。点下面的「重新读取」再试一次；还是不行，多半是本机服务没起来——回首页刷新，或确认 node server/server.js 在跑。';
      $('#retry').hidden = false;
      return false;
    }
    hideAuth();
    if (save && k) { try { sessionStorage.setItem(SK, k); } catch (e) {} }
    render(res.data);
    return true;
  }

  $('#retry').addEventListener('click', () => { boot(); });

  async function submit() {
    const k = $('#key').value.trim();
    if (!k) { showAuth('请输入访问 key'); return; }
    await apply(k, true);
  }

  async function boot() {
    let saved = '';
    try { saved = sessionStorage.getItem(SK) || ''; } catch (e) {}
    if (saved) {
      if (await apply(saved, false)) return;
      try { sessionStorage.removeItem(SK); } catch (e) {}   // 失效则丢弃，避免每次刷新都撞 403
      return;
    }
    await apply('', false);   // 无 key 探测：403 → 出输入区；200 → 直接出数据
  }

  const ORDER = [
    ['view', '页面打开'], ['help_open', '看教程'], ['sample_start', '示例体验'],
    ['sample_report', '示例出报告'], ['upload_start', '上传自己的'], ['ocr_ok', '识别成功'],
    ['report_done', '自己的报告'], ['share_open', '生成分享卡'],
    ['own_upload_after_sample', '示例后传自己的'], ['rules_from_report', '报告页改规则'],
  ];

  function render(d) {
    const t = d.totals || {}, td = d.today || {};
    const rows = ORDER.map(([k, label]) =>
      `<tr><td>${label}</td><td>${t[k] || 0}</td><td>${td[k] || 0}</td></tr>`).join('');
    const srcs = Object.keys(d.sources || {}).map(s => {
      const x = d.sources[s];
      return `<tr><td>${s}</td><td>${x.view || 0}</td><td>${x.sample_start || 0}</td><td>${x.upload_start || 0}</td><td>${(x.report_done || 0) + (x.sample_report || 0)}</td></tr>`;
    }).join('') || '<tr><td colspan="5">还没有数据</td></tr>';
    $('#body').innerHTML = `
      <div class="grid">
        <div class="card"><div class="k">独立访客</div><div class="v acc">${(d.unique || {}).visitors || 0}</div></div>
        <div class="card"><div class="k">出过报告的人</div><div class="v">${(d.unique || {}).reporters || 0}</div></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <table><thead><tr><th>事件</th><th>累计</th><th>今天</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
      <div class="card">
        <div class="k" style="margin-bottom:6px">按渠道（?src=）</div>
        <table><thead><tr><th>渠道</th><th>打开</th><th>示例</th><th>上传</th><th>报告</th></tr></thead><tbody>${srcs}</tbody></table>
      </div>`;
  }
  $('#go').addEventListener('click', submit);
  $('#key').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  boot();

  // B3a：只读展示本机授权状态。闸门关（默认）时也显示，只作诊断，不影响统计读取。
  try {
    if (window.PanjiLicenseUI) PanjiLicenseUI.mountStatusCard($('#pjl-slot'));
  } catch (e) {}
</script>
</body>
</html>
